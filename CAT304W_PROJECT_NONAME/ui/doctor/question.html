<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor | Patient Chats</title>
  <script>
    const role = localStorage.getItem("userRole");
    if (role !== "doctor") {
      window.location.href = "../patient/dashboard.html";
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../dashboard.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../shared-layout.css">
</head>
<body class="dash-body doctor-theme">
  <div class="page-layout">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark" id="brand-avatar">D</div>
        <span class="brand-name" id="brand-name">Doctor</span>
      </div>

      <div class="nav-group">
        <div class="nav-title">Doctor Menu</div>
        <ul class="nav-list">
          <li>
            <a class="nav-item" href="dashboard.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M3 11.5 12 4l9 7.5v7a1.5 1.5 0 0 1-1.5 1.5H4.5A1.5 1.5 0 0 1 3 18.5v-7Z"/>
                  <path d="M9 21V12h6v9"/>
                </svg>
              </span>
              Dashboard
            </a>
          </li>
          <li>
            <a class="nav-item active" href="question.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16v12H5.5L4 18V4Z" />
                  <path d="M8 9h8M8 12h5" />
                </svg>
              </span>
              Patient Chats
            </a>
          </li>
          <li>
            <a class="nav-item" href="appointments.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="4" width="16" height="16" rx="4" />
                  <path d="M8 7v4h4M10 11v6" />
                </svg>
              </span>
              Appointments
            </a>
          </li>
          <li>
            <a class="nav-item" href="report.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16v16H4z" />
                  <path d="M8 8h8M8 12h5M8 16h3" />
                </svg>
              </span>
              Reports
            </a>
          </li>
          <li>
            <a class="nav-item" href="profile.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="7" r="4"/>
                  <path d="M5 21a7 7 0 0 1 14 0"/>
                </svg>
              </span>
              Profile
            </a>
          </li>
          <li>
            <a class="nav-item" href="../login.html" id="logout-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                  <polyline points="10 17 15 12 10 7"/>
                  <line x1="15" y1="12" x2="3" y2="12"/>
                </svg>
              </span>
              Logout
            </a>
          </li>
        </ul>
      </div>

      <div class="nav-group settings">
        <div class="nav-title">Doctor Info</div>
        <ul class="nav-list">
          <li>
            <div class="nav-item">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="7" r="4"/>
                  <path d="M5 21a7 7 0 0 1 14 0"/>
                </svg>
              </span>
              <span id="doctor-name-display">Doctor</span>
            </div>
          </li>
          <li>
            <div class="nav-item">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2c-3.86 0-7 2.86-7 6.4 0 4.62 6.12 12.5 6.39 12.83a1 1 0 0 0 1.56 0C12.62 20.9 19 13.2 19 8.4 19 4.86 15.86 2 12 2Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Z"/>
                </svg>
              </span>
              <span id="doctor-hospital-display">Unknown hospital</span>
            </div>
          </li>
        </ul>
      </div>
    </aside>

    <main class="main-content main-panel">
      <section class="card hero">
        <div>
          <p class="value">Patient Chat (Doctor View)</p>
          <p class="lede">Review patient questions and respond in real time.</p>
        </div>
        <div class="hero-pattern" aria-hidden="true"></div>
      </section>

      <section class="card chat-card">
        <div class="question-chat-container doctor-chat">
          <div class="question-chat-header">
            <div>
              <p class="question-chat-title">Chat with patient</p>
              <p class="question-chat-subtitle">Current patient: <span id="current-patient-name">Demo Patient</span></p>
            </div>
            <div class="question-chat-status" aria-label="Doctor online">
              <span class="question-chat-status-dot" aria-hidden="true"></span>
              <span class="question-chat-status-text">Doctor online</span>
            </div>
          </div>
          <div id="doctor-chat-messages" class="question-chat-messages"></div>
          <div class="question-chat-input-area">
            <textarea id="doctor-chat-input" class="question-chat-input" placeholder="Type your reply to the patient… (Enter to send, Shift+Enter for newline)"></textarea>
            <button id="doctor-chat-send" class="question-chat-send-btn" type="button">Send</button>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./script.js"></script>
</body>
</html>
