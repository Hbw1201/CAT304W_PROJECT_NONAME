<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | MAQ-SCREEN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../login.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Please choose how you want to create an account.</p>
      </div>
      <div class="auth-actions" style="display: grid; gap: 12px;">
        <button class="btn-primary" type="button" onclick="window.location.href='register-self.html'">Create Account for Yourself</button>
        <button class="btn-ghost" type="button" onclick="window.location.href='register-other.html'">Create Account for Someone Else</button>
        <button class="btn-ghost" type="button" onclick="window.location.href='../login.html'">Back to Login</button>
      </div>
    </div>
  </div>
</body>
</html>
