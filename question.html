          </li>
          <li>

                </svg>
              </span>
              Report
            </a>
          </li>
          <li>
            <a class="nav-item" href="chatbot.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 4h16v12H5.5L4 18V4Z" />
                  <path d="M8 9h8M8 12h5" />
                </svg>
              </span>
              Chatbot
            </a>
          </li>
          <li>
            <a class="nav-item active" href="question.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M9.5 10.5a2.5 2.5 0 1 1 5 0c0 2-2.5 2-2.5 4" />
                  <path d="M12 17h.01" />
                </svg>
              </span>

            </a>
          </li>
          <li>
            <a class="nav-item" href="appointment.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

              </span>

          </li>
          <li>
            <a class="nav-item" href="screening.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

      <div class="nav-group settings">
        <div class="nav-title">Settings</div>
        <ul class="nav-list">
          <li>
            <a class="nav-item" href="index.html" id="logout-link">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

          </li>

            <a class="nav-item" href="profile.html">
              <span class="nav-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">

              </span>

            </a>

        </ul>
      </div>

    </aside>

    <main class="main-panel">
      <section class="card hero">
        <div>
          <p class="eyebrow">Question</p>
          <p class="lede">Track and resolve user questions and FAQs.</p>
        </div>
        <div class="hero-pattern" aria-hidden="true"></div>
      </section>

      <section class="card">
        <p class="value">Question workspace</p>
        <p class="label">Add open questions, resolutions, and assignments on this page.</p>
        <div class="pill plain" style="display: inline-block; margin-top: 8px;">Coming soon</div>
      </section>
    </main>
  </div>
  <script>
    (function () {
      const profile = (() => {
        try {
          return JSON.parse(localStorage.getItem("userProfile") || "null");
        } catch {
          return null;
        }
      })();
      const name = (profile?.name || "osler").trim() || "osler";
      const initial = name.charAt(0).toUpperCase() || "O";
      const brandName = document.getElementById("brand-name");
      const brandAvatar = document.getElementById("brand-avatar");
      if (brandName) brandName.textContent = name;
      if (brandAvatar) brandAvatar.textContent = initial;

      const logoutLink = document.getElementById("logout-link");
      logoutLink?.addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.clear();
        window.location.href = "index.html";
      });
    })();
  </script>

</html>
