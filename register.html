<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Osler AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Create Account</h1>
        <p>Get started with personalized telehealth. It only takes a minute.</p>
      </div>
      <form class="auth-form" id="registerForm">
        <label class="field">
          <span>First Name</span>
          <input type="text" id="firstName" name="firstName" autocomplete="given-name" placeholder="Jane">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="registerEmail" name="email" autocomplete="email" placeholder="you@example.com">
        </label>
        <label class="field">
          <span>Gender</span>
          <select id="gender" name="gender" class="select">
            <option value="" disabled selected>Select gender</option>
            <option value="female">Female</option>
            <option value="male">Male</option>
          </select>
        </label>
        <label class="field">
          <span>Age</span>
          <input type="number" id="age" name="age" min="1" max="120" inputmode="numeric" placeholder="e.g. 32">
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="registerPassword" name="password" autocomplete="new-password" placeholder="********">
        </label>
        <label class="field">
          <span>Confirm Password</span>
          <input type="password" name="confirm" autocomplete="new-password" placeholder="********">
        </label>
        <label class="field" style="flex-direction: row; align-items: center; gap: 10px;">
          <input type="checkbox" name="terms" style="width:18px;height:18px;">
          <span>I agree to the Terms &amp; Privacy Policy.</span>
        </label>
        <button type="submit" class="btn-primary">Create Account</button>
        <button type="button" class="btn-ghost" onclick="window.location.href='login.html'">Back to Login</button>
      </form>
    </div>
  </div>
  <script type="module" src="script.js"></script>
</body>
</html>
