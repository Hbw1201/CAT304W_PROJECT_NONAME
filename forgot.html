<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Osler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login.css">
</head>
<body class="auth-body">
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-header">
        <h1>Reset Password</h1>
        <p>Enter your account email to receive a reset link.</p>
      </div>
      <form class="auth-form" onsubmit="return false;">
        <label class="field">
          <span>Email</span>
          <input type="email" id="resetEmail" name="email" autocomplete="email" placeholder="you@example.com" required>
        </label>
        <button type="button" class="btn-primary" id="resetBtn">Send Reset Email</button>
        <button type="button" class="btn-ghost" onclick="window.location.href='login.html'">Back to Login</button>
      </form>
    </div>
  </div>
  <script type="module" src="forgot.js"></script>
</body>
</html>
